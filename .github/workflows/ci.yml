name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Content rules that matter more than they look. Sellers read this copy
      # aloud to real customers, so a claim that creeps back in gets said out
      # loud in a shop before anyone notices it in a diff.
      - name: Content rules
        run: npm run check:content
