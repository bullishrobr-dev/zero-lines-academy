<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is deliberately NOT disabled: sellers read price scripts in bright daylight. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1517" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Sales training academy for street professionals" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zero Lines" />
    <title>Zero Lines Academy</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!--
      The fonts are self-hosted — see the @font-face block at the top of
      src/index.css. Do not put a fonts.googleapis.com stylesheet back here:
      it is a render-blocking third-party request, and on the signal inside
      the shopping centre it held the first paint for 12.6 seconds.
    -->
    <!--
      Apply the saved theme before first paint so there is no flash of the wrong
      theme. Mirrors the resolution logic in src/contexts/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zl_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall through to the light default */
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Dr3jYTcL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BWy67xe9.css">
  </head>
  <body>
    <div id="root"></div>
    <!--
      ── SOMETHING TO LOOK AT WHILE THE APP DOWNLOADS ─────────────────────────
      Measured cold on shopping-centre conditions (50 KB/s, 400 ms RTT, 4x CPU):
      the stylesheet is on the device at ~1.4s and React does not paint until
      ~6.5s. That is five seconds of a blank coloured rectangle with the CSS
      needed to draw something already sitting there unused.

      This is a SIBLING of #root, deliberately and load-bearingly so. The boot
      retry further down decides the app mounted by asking whether #root has any
      children; put the skeleton inside #root and that test is true forever, and
      the one retry this file exists to provide is silently switched off.

      It uses classes the app's own stylesheet already defines (LoadingScreen
      draws the same three rows), so it costs no bytes and cannot drift from the
      theme. main.tsx removes it immediately after render().
    -->
    <div id="boot-shell" aria-hidden="true" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
      <p class="text-h3 text-ink" style="letter-spacing:0.12em">ZERO LINES</p>
      <div class="mt-10 w-full max-w-[360px] space-y-3">
        <div class="surface-flat animate-pulse p-4">
          <div class="flex items-center gap-3">
            <div class="h-11 w-11 rounded-chip bg-surface-sunken"></div>
            <div class="flex-1 space-y-2">
              <div class="h-3.5 w-3/4 rounded-full bg-surface-sunken"></div>
              <div class="h-3 w-1/2 rounded-full bg-surface-sunken"></div>
            </div>
          </div>
        </div>
        <div class="surface-flat animate-pulse p-4">
          <div class="flex items-center gap-3">
            <div class="h-11 w-11 rounded-chip bg-surface-sunken"></div>
            <div class="flex-1 space-y-2">
              <div class="h-3.5 w-3/4 rounded-full bg-surface-sunken"></div>
              <div class="h-3 w-1/2 rounded-full bg-surface-sunken"></div>
            </div>
          </div>
        </div>
        <div class="surface-flat animate-pulse p-4">
          <div class="flex items-center gap-3">
            <div class="h-11 w-11 rounded-chip bg-surface-sunken"></div>
            <div class="flex-1 space-y-2">
              <div class="h-3.5 w-3/4 rounded-full bg-surface-sunken"></div>
              <div class="h-3 w-1/2 rounded-full bg-surface-sunken"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            /* offline support unavailable — the app still works online */
          });
        });
      }
    </script>
    <!--
      ── ONE RETRY, FOR THE COLD OFFLINE START ────────────────────────────────
      Reopening the app with no signal can white-screen exactly once.

      Measured, with the network genuinely cut: a brand-new tab is controlled by
      the service worker, the document is served from cache, and the worker can
      serve the boot script — a fetch() for it from the page returns 200. But
      the module script request itself had already failed, because the worker
      was asleep and the subresource went out while it was still starting. The
      tab renders nothing. Reloading that same tab, still offline, works.

      A seller does not know to pull-to-refresh. They are in a basement shopping
      centre with a customer in front of them, looking at a white screen, and
      the app is broken as far as they are concerned. So if the app has not
      mounted shortly after load, reload once and let the now-warm worker serve
      it. Guarded by sessionStorage, so a genuinely broken build shows the blank
      page rather than reloading forever — one retry, never a loop.
    -->
    <script>
      (function () {
        var KEY = 'zl_boot_retry';
        var decided = false;

        function mounted() {
          var r = document.getElementById('root');
          return !!(r && r.childElementCount > 0);
        }

        function decide() {
          if (decided) return;
          decided = true;
          if (mounted()) {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            return;
          }
          try {
            if (sessionStorage.getItem(KEY)) return; // already spent the one retry
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return; // no sessionStorage means no way to stop a loop — do not risk it
          }
          location.reload();
        }

        window.addEventListener('load', function () {
          /*
           * Wait for the worker to be RUNNING before deciding, not for a fixed
           * number of seconds. The failure this recovers from is the worker
           * being asleep when the boot script was requested; reloading while it
           * is still starting just reproduces it and burns the one retry — which
           * is exactly what happened on a slower machine when this was a plain
           * 3.5s timer. `ready` resolves when there is an active worker for this
           * page, which is the moment a reload can actually be served.
           */
          var grace = function () { setTimeout(decide, 600); };
          if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(grace, grace);
          }
          /* And an absolute backstop, for the case where `ready` never settles
             at all: still only ever one reload. */
          setTimeout(decide, 8000);
        });
      })();
    </script>
  </body>
</html>
