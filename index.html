<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is deliberately NOT disabled: sellers read price scripts in bright daylight. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1517" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Sales training academy for street professionals" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zero Lines" />
    <title>Zero Lines Academy</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply the saved theme before first paint so there is no flash of the wrong
      theme. Mirrors the resolution logic in src/contexts/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zl_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall through to the light default */
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BubEOQ-I.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D0DmYRh6.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            /* offline support unavailable — the app still works online */
          });
        });
      }
    </script>
  </body>
</html>
